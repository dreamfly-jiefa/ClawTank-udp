[package]
name = "clawtank-core"
description = "ClawTank RDP protocol core (IronRDP) exposed to the Swift host via a C ABI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
# Exact pins for IronRDP: see docs/research/ironrdp.md. Bump deliberately, never implicitly.
ironrdp-server = { git = "https://github.com/Devolutions/IronRDP", rev = "293cb4bee90baddfd7b8ea08d2f46e31947a3888", default-features = false, features = ["egfx"] }
ironrdp-cliprdr = { git = "https://github.com/Devolutions/IronRDP", rev = "293cb4bee90baddfd7b8ea08d2f46e31947a3888" }
ironrdp-core = { git = "https://github.com/Devolutions/IronRDP", rev = "293cb4bee90baddfd7b8ea08d2f46e31947a3888" }
ironrdp-displaycontrol = { git = "https://github.com/Devolutions/IronRDP", rev = "293cb4bee90baddfd7b8ea08d2f46e31947a3888" }
ironrdp-dvc = { git = "https://github.com/Devolutions/IronRDP", rev = "293cb4bee90baddfd7b8ea08d2f46e31947a3888" }
ironrdp-egfx = { git = "https://github.com/Devolutions/IronRDP", rev = "293cb4bee90baddfd7b8ea08d2f46e31947a3888" }
ironrdp-pdu = { git = "https://github.com/Devolutions/IronRDP", rev = "293cb4bee90baddfd7b8ea08d2f46e31947a3888" }
ironrdp-rdpsnd = { git = "https://github.com/Devolutions/IronRDP", rev = "293cb4bee90baddfd7b8ea08d2f46e31947a3888" }
ironrdp-svc = { git = "https://github.com/Devolutions/IronRDP", rev = "293cb4bee90baddfd7b8ea08d2f46e31947a3888" }
async-trait = "0.1"
bytes = "1"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "crypto"] }
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "env-filter"] }
x509-cert = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
anyhow = "1" # examples and tests
# Client side of the integration test (tests/connect.rs): IronRDP's own client stack.
ironrdp-async = { git = "https://github.com/Devolutions/IronRDP", rev = "293cb4bee90baddfd7b8ea08d2f46e31947a3888" }
ironrdp-connector = { git = "https://github.com/Devolutions/IronRDP", rev = "293cb4bee90baddfd7b8ea08d2f46e31947a3888" }
ironrdp-graphics = { git = "https://github.com/Devolutions/IronRDP", rev = "293cb4bee90baddfd7b8ea08d2f46e31947a3888" }
ironrdp-session = { git = "https://github.com/Devolutions/IronRDP", rev = "293cb4bee90baddfd7b8ea08d2f46e31947a3888" }
ironrdp-tokio = { git = "https://github.com/Devolutions/IronRDP", rev = "293cb4bee90baddfd7b8ea08d2f46e31947a3888", features = ["reqwest"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
ironrdp-rdpeudp-tokio = { git = "https://github.com/Devolutions/IronRDP", rev = "293cb4bee90baddfd7b8ea08d2f46e31947a3888" }
ironrdp-rdpeudp = { git = "https://github.com/Devolutions/IronRDP", rev = "293cb4bee90baddfd7b8ea08d2f46e31947a3888" }
ironrdp-rdpemt = { git = "https://github.com/Devolutions/IronRDP", rev = "293cb4bee90baddfd7b8ea08d2f46e31947a3888" }

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }
