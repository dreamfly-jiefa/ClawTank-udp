name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches: [feat/udp-multitransport]

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install tools
        run: brew install xcodegen swiftlint

      - name: Import stable signing identity
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/clawtank-ci.keychain"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import scripts/ci-signing/clawtank-ci.p12 -k "$KEYCHAIN" -P clawtank-ci \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '\"')

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build app
        run: make build CODE_SIGN_IDENTITY="ClawTank CI" OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/clawtank-ci.keychain"

      - name: Assert the app is signed by the stable identity
        run: |
          set -euo pipefail
          APP="app/build/Build/Products/Release/ClawTank.app"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -q "Authority=ClawTank CI"
          codesign -dv --verbose=2 "$APP/Contents/MacOS/clawtank-mcp" 2>&1 | grep -q "Authority=ClawTank CI"
          /usr/bin/codesign --verify --strict --deep "$APP"

      - name: Package DMG
        run: |
          set -euo pipefail
          APP="app/build/Build/Products/Release/ClawTank.app"
          test -d "$APP"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          codesign --verify --deep --strict "$APP"
          mkdir -p dist
          STAGE=$(mktemp -d)
          cp -R "$APP" "$STAGE/ClawTank.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "ClawTank $VERSION" -srcfolder "$STAGE" -ov -format UDZO "dist/ClawTank-$VERSION-arm64.dmg"
          rm -rf "$STAGE"
          (cd dist && shasum -a 256 *.dmg > SHA256SUMS && cat SHA256SUMS)
          hdiutil verify "dist/ClawTank-$VERSION-arm64.dmg"
          codesign --verify --deep --strict "$APP/Contents/MacOS/clawtank-mcp"

      - uses: actions/upload-artifact@v4
        with:
          name: ClawTank-arm64-dmg
          path: |
            dist/*.dmg
            dist/SHA256SUMS
          if-no-files-found: error
